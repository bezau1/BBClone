*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

html,body{
  width:100%;height:100%;
  font-family:'Determination',monospace;
  overflow:hidden;
  touch-action:none;
  background:#000;
  color:#fff;
}

body{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  min-height:100dvh;
  background:#000;
}

#topbar{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 20px 6px;
  flex-shrink:0;
}

#best-display{
  display:flex;align-items:center;gap:4px;
  font-size:0.65rem;
  color:#aaa;
  letter-spacing:0.05em;
}
#best-display .crown{font-size:1.2rem;}

#score-display{
  text-align:center;
  font-size:clamp(2rem,8vw,3rem);
  color:#fff;
  flex:1;
  letter-spacing:0.05em;
}

#settings-btn{
  width:38px;height:38px;
  background:#000;
  border:2px solid #fff;
  border-radius:0;
  color:#fff;font-size:1rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:'Determination',monospace;
  padding:4px;
}

#board-wrap{
  position:relative;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}

#board{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:3px;
  background:#000;
  border:3px solid #fff;
  padding:8px;
}

.cell{
  aspect-ratio:1;
  background:#000;
  border:2px solid #333;
  position:relative;
}

.cell.filled{
  background:#000;
  border:2px solid #fff;
}

/* no ::before / ::after sheen — flat look */
.cell.filled::before{ display:none; }
.cell.filled::after{ display:none; }

.cell.preview{
  opacity:0.55;
  background:#000;
  border:2px solid #fff;
}
.cell.preview::before{ display:none; }
.cell.preview::after{ display:none; }

.cell.invalid-preview{
  background:#000 !important;
  border:2px solid #666 !important;
  opacity:0.3;
}

@keyframes clearCell{
  0%{transform:scale(1);opacity:1;}
  40%{transform:scale(1.2);opacity:0.8;}
  100%{transform:scale(0);opacity:0;}
}
.clearing{animation:clearCell 0.28s ease forwards;}

@keyframes dropIn{
  0%{transform:scale(0.4);opacity:0;}
  70%{transform:scale(1.1);}
  100%{transform:scale(1);opacity:1;}
}
.drop-in{animation:dropIn 0.22s ease forwards;}

#tray{
  display:flex;gap:10px;justify-content:center;align-items:center;
  flex-shrink:0;
  padding:10px 10px 8px;
  width:100%;
}

.piece-slot{
  flex:1;
  max-width:120px;
  aspect-ratio:1;
  background:#000;
  border:2px solid #555;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  position:relative;
  transition:border-color 0.1s,transform 0.1s;
  touch-action:none;
}
.piece-slot.selected{
  border-color:#fff;
}
.piece-slot.used{opacity:0.12;pointer-events:none;}
.piece-slot:active{transform:scale(0.95);}

.piece-mini{
  display:grid;
  gap:2px;
  pointer-events:none;
}
.pmcell{width:14px;height:14px;background:transparent;}
.pmcell.filled{
  background:#000;
  border:2px solid #fff;
}
.pmcell.filled::before{ display:none; }
.pmcell.filled::after{ display:none; }

/* ghost */
#ghost{
  position:fixed;pointer-events:none;z-index:9999;
  display:none;transform:translate(-50%,-120%);
}
#ghost .pmcell{width:20px;height:20px;}

/* overlay */
#overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.92);
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:1000;gap:20px;
}
#overlay h2{
  font-size:2.4rem;
  color:#fff;
  letter-spacing:0.1em;
  font-family:'Determination',monospace;
  border-bottom:3px solid #fff;
  padding-bottom:10px;
}
#overlay .sub{font-size:0.95rem;color:#aaa;letter-spacing:0.05em;}
#overlay .final{
  font-size:2rem;
  color:#fff;
  font-family:'Determination',monospace;
  letter-spacing:0.05em;
}
.play-btn{
  background:#000;
  border:3px solid #fff;
  border-radius:0;
  color:#fff;
  font-family:'Determination',monospace;
  font-size:1rem;
  padding:12px 40px;
  cursor:pointer;
  letter-spacing:0.1em;
  transition:background 0.1s,color 0.1s;
}
.play-btn:hover{background:#fff;color:#000;}
.play-btn:active{transform:scale(0.96);}

@keyframes scoreFloat{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-60px);}}
.score-fx{
  position:fixed;pointer-events:none;
  font-family:'Determination',monospace;font-size:1.4rem;
  color:#fff;
  animation:scoreFloat 1s ease forwards;z-index:500;
}
@keyframes comboFx{
  0%{opacity:0;transform:translate(-50%,-50%)scale(0.5);}
  30%{opacity:1;transform:translate(-50%,-50%)scale(1.25);}
  80%{opacity:1;transform:translate(-50%,-50%)scale(1.1);}
  100%{opacity:0;transform:translate(-50%,-70%)scale(1);}
}
.combo-fx{
  position:fixed;pointer-events:none;
  font-family:'Determination',monospace;font-size:2rem;
  color:#fff;
  animation:comboFx 0.9s ease forwards;z-index:501;white-space:nowrap;
  letter-spacing:0.1em;
}

/* Settings panel */
#settings-panel{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.92);
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:2000;gap:24px;
}
#settings-panel h2{
  font-size:1.8rem;color:#fff;
  font-family:'Determination',monospace;
  letter-spacing:0.1em;
  border-bottom:3px solid #fff;
  padding-bottom:10px;
  width:260px;text-align:center;
}
.setting-row{
  display:flex;align-items:center;justify-content:space-between;
  width:260px;
  font-family:'Determination',monospace;
  font-size:1rem;color:#fff;letter-spacing:0.05em;
}
.toggle{
  width:52px;height:26px;
  background:#000;border:2px solid #fff;
  position:relative;cursor:pointer;
  display:flex;align-items:center;
}
.toggle-knob{
  width:20px;height:18px;
  background:#fff;
  position:absolute;left:2px;
  transition:left 0.15s;
}
.toggle.on .toggle-knob{left:28px;}
.settings-close{
  background:#000;border:3px solid #fff;border-radius:0;
  color:#fff;font-family:'Determination',monospace;
  font-size:1rem;padding:10px 36px;cursor:pointer;
  letter-spacing:0.1em;margin-top:8px;
  transition:background 0.1s,color 0.1s;
}

<script>
const ROWS=8,COLS=8;
// All blocks look the same (black+white outline), colorIdx kept for compat but unused visually
const COLOR_CLASSES=['','','','','',''];

const PIECES=[
  {s:[[1]],w:3},
  {s:[[1,1]],w:4},
  {s:[[1],[1]],w:4},
  {s:[[1,1,1]],w:4},
  {s:[[1],[1],[1]],w:4},
  {s:[[1,1],[1,1]],w:4},
  {s:[[1,1,1,1]],w:2},
  {s:[[1],[1],[1],[1]],w:2},
  {s:[[1,0],[1,0],[1,1]],w:2},
  {s:[[0,1],[0,1],[1,1]],w:2},
  {s:[[1,1],[1,0],[1,0]],w:2},
  {s:[[1,1],[0,1],[0,1]],w:2},
  {s:[[0,1,1],[1,1,0]],w:2},
  {s:[[1,1,0],[0,1,1]],w:2},
  {s:[[1,1,1],[0,1,0]],w:2},
  {s:[[0,1,0],[1,1,1]],w:2},
  {s:[[1,0,0],[1,0,0],[1,1,1]],w:1},
  {s:[[0,0,1],[0,0,1],[1,1,1]],w:1},
  {s:[[1,1,1],[1,0,0],[1,0,0]],w:1},
  {s:[[1,1,1],[0,0,1],[0,0,1]],w:1},
  {s:[[0,1,0],[1,1,1],[0,1,0]],w:1},
  {s:[[1,1],[1,1],[1,1]],w:1},
  {s:[[1,1,1],[1,1,1]],w:1},
];

let board,score,best,pieces,selectedSlot;
let isDragging=false,dragSlot=-1;
let touchX=0,touchY=0;
let boardRect=null,cellSize=0;

function wRandom(){
  const tot=PIECES.reduce((a,p)=>a+p.w,0);
  let r=Math.random()*tot;
  for(const p of PIECES){r-=p.w;if(r<=0)return p;}
  return PIECES[0];
}
function randomPiece(){
  const p=wRandom();
  return{shape:p.s,colorIdx:0};
}

function canPlace(piece,r,c){
  for(let pr=0;pr<piece.shape.length;pr++)
    for(let pc=0;pc<piece.shape[pr].length;pc++){
      if(!piece.shape[pr][pc])continue;
      const br=r+pr,bc=c+pc;
      if(br<0||br>=ROWS||bc<0||bc>=COLS||board[br][bc]!==null)return false;
    }
  return true;
}
function hasPlacement(piece){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(canPlace(piece,r,c))return true;
  return false;
}
function canPlaceAny(){return pieces.some(p=>p&&hasPlacement(p));}

function generatePieces(){
  const result=[];
  for(let i=0;i<3;i++){
    let p,tries=0;
    do{p=randomPiece();tries++;}while(!hasPlacement(p)&&tries<80);
    result.push(p);
  }
  return result;
}

function saveState(){
  try{
    localStorage.setItem('bbUndertale_board', JSON.stringify(board));
    localStorage.setItem('bbUndertale_pieces', JSON.stringify(pieces));
    localStorage.setItem('bbUndertale_score', score);
  }catch(e){}
}

function loadState(){
  try{
    const b=localStorage.getItem('bbUndertale_board');
    const p=localStorage.getItem('bbUndertale_pieces');
    const s=localStorage.getItem('bbUndertale_score');
    if(b&&p&&s){
      board=JSON.parse(b);
      pieces=JSON.parse(p);
      score=parseInt(s);
      return true;
    }
  }catch(e){}
  return false;
}

function clearSavedState(){
  localStorage.removeItem('bbUndertale_board');
  localStorage.removeItem('bbUndertale_pieces');
  localStorage.removeItem('bbUndertale_score');
}

function startGame(){
  board=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  score=0;
  best=parseInt(localStorage.getItem('bbUndertale')||'0');
  selectedSlot=null;isDragging=false;dragSlot=-1;
  document.getElementById('overlay').style.display='none';
  clearSavedState();
  renderBoard();
  resize();
  setTimeout(()=>{
    measureBoard();
    pieces=generatePieces();
    renderTray();
    updateUI();
  },60);
}

function resumeGame(){
  best=parseInt(localStorage.getItem('bbUndertale')||'0');
  selectedSlot=null;isDragging=false;dragSlot=-1;
  document.getElementById('overlay').style.display='none';
  renderBoard();
  resize();
  setTimeout(()=>{
    measureBoard();
    renderTray();
    updateUI();
  },60);
}

function renderBoard(dropCells=[]){
  const bd=document.getElementById('board');
  bd.innerHTML='';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const el=document.createElement('div');
    el.className='cell';
    el.dataset.r=r;el.dataset.c=c;
    if(board[r][c]!==null){
      el.classList.add('filled');
      if(dropCells.some(([dr,dc])=>dr===r&&dc===c))el.classList.add('drop-in');
    }
    bd.appendChild(el);
  }
  bd.addEventListener('mousemove',onBoardMouseMove,{passive:true});
  bd.addEventListener('mouseleave',clearPreview);
  bd.addEventListener('click',onBoardClick);
  bd.addEventListener('touchmove',onBoardTouchMove,{passive:false});
  bd.addEventListener('touchend',onBoardTouchEnd,{passive:false});
}

function measureBoard(){
  const bd=document.getElementById('board');
  boardRect=bd.getBoundingClientRect();
  const first=bd.querySelector('.cell');
  if(first)cellSize=first.getBoundingClientRect().width;
}

function cellFromPoint(x,y){
  if(!boardRect||!cellSize)return null;
  const pad=8,gap=3;
  const bx=x-boardRect.left-pad;
  const by=y-boardRect.top-pad;
  const stride=cellSize+gap;
  const c=Math.floor(bx/stride),r=Math.floor(by/stride);
  if(r<0||r>=ROWS||c<0||c>=COLS)return null;
  return{r,c};
}

function clearPreview(){
  document.querySelectorAll('.cell.preview,.cell.invalid-preview').forEach(el=>{
    const r=+el.dataset.r,c=+el.dataset.c;
    el.className='cell';
    if(board[r][c]!==null)el.classList.add('filled');
  });
}

function showPreview(piece,row,col){
  clearPreview();
  const ok=canPlace(piece,row,col);
  for(let pr=0;pr<piece.shape.length;pr++)
    for(let pc=0;pc<piece.shape[pr].length;pc++){
      if(!piece.shape[pr][pc])continue;
      const el=document.querySelector(`[data-r="${row+pr}"][data-c="${col+pc}"]`);
      if(!el)continue;
      if(ok)el.classList.add('preview','filled');
      else el.classList.add('invalid-preview');
    }
}

function onBoardMouseMove(e){
  if(selectedSlot===null)return;
  const p=pieces[selectedSlot];if(!p)return;
  const pos=cellFromPoint(e.clientX,e.clientY);
  if(!pos){clearPreview();return;}
  showPreview(p,pos.r,pos.c);
}
function onBoardClick(e){
  if(selectedSlot===null)return;
  const p=pieces[selectedSlot];if(!p)return;
  const pos=cellFromPoint(e.clientX,e.clientY);
  if(!pos)return;
  if(!canPlace(p,pos.r,pos.c)){playsfx("invalid");return;}
  doPlace(p,selectedSlot,pos.r,pos.c);
}

function onBoardTouchMove(e){
  if(!isDragging)return;
  e.preventDefault();
  const t=e.touches[0];
  touchX=t.clientX;touchY=t.clientY;
  moveGhost(touchX,touchY);
  const pos=cellFromPoint(touchX,touchY);
  if(pos&&pieces[dragSlot])showPreview(pieces[dragSlot],pos.r,pos.c);
  else clearPreview();
}
function onBoardTouchEnd(e){
  if(!isDragging)return;
  e.preventDefault();
  hideGhost();
  const pos=cellFromPoint(touchX,touchY);
  if(pos&&pieces[dragSlot]&&canPlace(pieces[dragSlot],pos.r,pos.c)){
    doPlace(pieces[dragSlot],dragSlot,pos.r,pos.c);
  }else{clearPreview();}
  isDragging=false;dragSlot=-1;
}

function renderTray(){
  for(let i=0;i<3;i++){
    const slot=document.getElementById(`slot-${i}`);
    slot.innerHTML='';
    slot.className='piece-slot';
    if(!pieces[i]){slot.classList.add('used');continue;}
    if(i===selectedSlot)slot.classList.add('selected');

    const p=pieces[i];
    const cols=p.shape[0].length;
    const mini=document.createElement('div');
    mini.className='piece-mini';
    mini.style.gridTemplateColumns=`repeat(${cols},1fr)`;
    for(let r=0;r<p.shape.length;r++)
      for(let c=0;c<cols;c++){
        const mc=document.createElement('div');
        mc.className='pmcell'+(p.shape[r][c]?' filled':'');
        mini.appendChild(mc);
      }
    slot.appendChild(mini);

    slot.onclick=(e)=>{e.stopPropagation();selectSlot(i);};

    slot.addEventListener('touchstart',e=>{
      e.preventDefault();
      if(!pieces[i])return;
      dragSlot=i;isDragging=true;
      selectedSlot=i;renderTray();
      const t=e.touches[0];
      touchX=t.clientX;touchY=t.clientY;
      showGhost(pieces[i]);
      moveGhost(touchX,touchY);
      measureBoard();
    },{passive:false});

    slot.addEventListener('touchmove',e=>{
      e.preventDefault();
      if(!isDragging)return;
      const t=e.touches[0];
      touchX=t.clientX;touchY=t.clientY;
      moveGhost(touchX,touchY);
      const pos=cellFromPoint(touchX,touchY);
      if(pos&&pieces[dragSlot])showPreview(pieces[dragSlot],pos.r,pos.c);
      else clearPreview();
    },{passive:false});

    slot.addEventListener('touchend',e=>{
      e.preventDefault();
      hideGhost();
      if(!isDragging||!pieces[dragSlot]){isDragging=false;return;}
      const pos=cellFromPoint(touchX,touchY);
      if(pos&&canPlace(pieces[dragSlot],pos.r,pos.c)){
        doPlace(pieces[dragSlot],dragSlot,pos.r,pos.c);
      }else{clearPreview();}
      isDragging=false;dragSlot=-1;
    },{passive:false});
  }
}

function selectSlot(i){
  if(!pieces[i])return;
  selectedSlot=selectedSlot===i?null:i;
  if(selectedSlot===i) playsfx("select");
  clearPreview();
  renderTray();
}

function showGhost(piece){
  const ghost=document.getElementById('ghost');
  const grid=document.getElementById('ghost-grid');
  const cols=piece.shape[0].length;
  grid.innerHTML='';
  grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  for(let r=0;r<piece.shape.length;r++)
    for(let c=0;c<cols;c++){
      const mc=document.createElement('div');
      mc.className='pmcell'+(piece.shape[r][c]?' filled':'');
      grid.appendChild(mc);
    }
  ghost.style.display='block';
}
function moveGhost(x,y){
  const g=document.getElementById('ghost');
  g.style.left=x+'px';g.style.top=(y-55)+'px';
}
function hideGhost(){document.getElementById('ghost').style.display='none';}

function doPlace(piece,slotIdx,row,col){
  playsfx("place");
  const filled=[];
  for(let pr=0;pr<piece.shape.length;pr++)
    for(let pc=0;pc<piece.shape[pr].length;pc++){
      if(!piece.shape[pr][pc])continue;
      board[row+pr][col+pc]=1;
      filled.push([row+pr,col+pc]);
    }
  score+=filled.length*10;
  pieces[slotIdx]=null;
  selectedSlot=null;
  clearPreview();
  renderBoard(filled);
  setTimeout(()=>{measureBoard();processClears();},240);
}

function processClears(){
  const rowsToClear=[],colsToClear=[];
  for(let r=0;r<ROWS;r++)if(board[r].every(v=>v!==null))rowsToClear.push(r);
  for(let c=0;c<COLS;c++)if(board.every(row=>row[c]!==null))colsToClear.push(c);

  if(!rowsToClear.length&&!colsToClear.length){finalizeTurn();return;}

  const cells=new Set();
  rowsToClear.forEach(r=>{for(let c=0;c<COLS;c++)cells.add(`${r},${c}`);});
  colsToClear.forEach(c=>{for(let r=0;r<ROWS;r++)cells.add(`${r},${c}`);});

  cells.forEach(key=>{
    const[r,c]=key.split(',').map(Number);
    const el=document.querySelector(`[data-r="${r}"][data-c="${c}"]`);
    if(el)el.classList.add('clearing');
  });

  const cleared=rowsToClear.length+colsToClear.length;
  const pts=cells.size*20*cleared;
  score+=pts;
  if(score>best){best=score;localStorage.setItem('bbUndertale',best);}
  updateUI();
  showScoreFx(pts);
  if(cleared>=2){showComboFx(cleared);playsfx("combo");}else{playsfx("clear");}

  setTimeout(()=>{
    rowsToClear.forEach(r=>{for(let c=0;c<COLS;c++)board[r][c]=null;});
    colsToClear.forEach(c=>{for(let r=0;r<ROWS;r++)board[r][c]=null;});
    renderBoard();measureBoard();
    finalizeTurn();
  },310);
}

function finalizeTurn(){
  updateUI();
  if(pieces.every(p=>p===null)){pieces=generatePieces();}
  renderTray();
  saveState();
  if(!canPlaceAny())setTimeout(gameOver,400);
}

function updateUI(){
  document.getElementById('score-display').textContent=score.toLocaleString();
  document.getElementById('best-val').textContent=best.toLocaleString();
}
function gameOver(){
  clearSavedState();
  playsfx("gameover");
  document.getElementById('overlay').style.display='flex';
  document.getElementById('final-score').textContent=score.toLocaleString();
}

function showScoreFx(pts){
  const el=document.createElement('div');el.className='score-fx';
  el.textContent=`+${pts}`;
  const br=document.getElementById('board').getBoundingClientRect();
  el.style.left=(br.left+br.width/2-20)+'px';
  el.style.top=(br.top+br.height*0.35)+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1000);
}
function showComboFx(n){
  const lbl=['','','DOUBLE!','TRIPLE!','QUAD!','ULTRA!'];
  const el=document.createElement('div');el.className='combo-fx';
  el.textContent=lbl[n]||`${n}x LINE!`;
  const br=document.getElementById('board').getBoundingClientRect();
  el.style.left=(br.left+br.width/2)+'px';
  el.style.top=(br.top+br.height/2)+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),950);
}

function resize(){
  const vw=window.innerWidth,vh=window.innerHeight;
  const topH=document.getElementById('topbar').getBoundingClientRect().height||60;
  const trayH=120;
  const available=vh-topH-trayH-20;
  const maxBoard=Math.min(vw*0.96,available,480);
  const bd=document.getElementById('board');
  bd.style.width=maxBoard+'px';
  document.getElementById('board-wrap').style.width=(maxBoard+10)+'px';
  const slotSz=Math.min(Math.floor((maxBoard-30)/3),118);
  document.querySelectorAll('.piece-slot').forEach(s=>{
    s.style.width=slotSz+'px';
    s.style.maxWidth=slotSz+'px';
    s.style.height=slotSz+'px';
  });
  setTimeout(measureBoard,50);
}

window.addEventListener('resize',()=>{resize();setTimeout(measureBoard,120);});
window.addEventListener('beforeunload',()=>{ saveState(); });
window.addEventListener('pagehide',()=>{ saveState(); });
window.addEventListener('orientationchange',()=>setTimeout(()=>{resize();measureBoard();},250));

resize();
// Try to resume saved game, otherwise start fresh
if(loadState()){
  resumeGame();
} else {
  startGame();
}

};

let sfxEnabled = localStorage.getItem('bbSfx') !== 'off';

function playsfx(name){
  if(!sfxEnabled)return;
  try{
    const audio = new Audio(SFX_DATA[name]);
    audio.volume = 0.6;
    audio.play().catch(()=>{});
  }catch(e){}
}

function toggleSfx(){
  sfxEnabled = !sfxEnabled;
  localStorage.setItem('bbSfx', sfxEnabled ? 'on' : 'off');
  const t = document.getElementById('sfx-toggle');
  sfxEnabled ? t.classList.add('on') : t.classList.remove('on');
}

function openSettings(){
  document.getElementById('settings-panel').style.display='flex';
  const t = document.getElementById('sfx-toggle');
  sfxEnabled ? t.classList.add('on') : t.classList.remove('on');
}

function closeSettings(){
  document.getElementById('settings-panel').style.display='none';
}

function resetBest(){
  best=0;
  localStorage.setItem('bbUndertale','0');
  updateUI();
}

// Wire settings button
document.getElementById('settings-btn').onclick = openSettings;

</script>

      <div class="toggle-knob"></div>
